name: Market Pulse Scanner

on:
  schedule:
    # 9:00 AM IST → 3:30 AM UTC (minus 5:30)
    - cron: '30 3 * * 1-5'
    # 10:00 AM IST → 4:30 AM UTC
    - cron: '30 4 * * 1-5'
    # 11:00 AM IST → 5:30 AM UTC
    - cron: '30 5 * * 1-5'
    # 12:00 PM IST → 6:30 AM UTC
    - cron: '30 6 * * 1-5'
    # 1:00 PM IST → 7:30 AM UTC
    - cron: '30 7 * * 1-5'
    # 2:00 PM IST → 8:30 AM UTC
    - cron: '30 8 * * 1-5'
    # 3:00 PM IST → 9:30 AM UTC
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install packages
        run: pip install nsetools requests
      - name: Run Market Pulse
        env:
          TELEGRAM_PULSE_BOT_TOKEN: ${{ secrets.TELEGRAM_PULSE_BOT_TOKEN }}
          TELEGRAM_PULSE_CHAT_ID: ${{ secrets.TELEGRAM_PULSE_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python market_pulse.py
