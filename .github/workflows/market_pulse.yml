name: Market Pulse Scanner

on:
  schedule:
    - cron: '0 1 * * 0-4'
    - cron: '0 2 * * 0-4'
    - cron: '0 3 * * 0-4'
    - cron: '0 4 * * 0-4'
    - cron: '0 5 * * 0-4'
    - cron: '0 6 * * 0-4'
    - cron: '0 7 * * 0-4'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install packages
        run: pip install nsetools requests numpy yfinance
      - name: Run Market Pulse
        env:
          TELEGRAM_PULSE_BOT_TOKEN: ${{ secrets.TELEGRAM_PULSE_BOT_TOKEN }}
          TELEGRAM_PULSE_CHAT_ID: ${{ secrets.TELEGRAM_PULSE_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python market_pulse.py
